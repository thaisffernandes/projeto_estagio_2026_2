<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Administrador</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            letter-spacing: 0.5px;
        }

        .login-card {
            background-color: #111111;
            border: 1px solid #222222;
            padding: 48px 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #888888;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 36px;
        }

        .alert-error {
            background-color: #1a0000;
            border: 1px solid #550000;
            color: #ff6b6b;
            font-size: 0.8rem;
            padding: 10px;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #aaaaaa;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: #000000;
            border: 1px solid #333333;
            color: #ffffff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: #ffffff;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #cccccc;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h1 class="brand-title">ADMINISTRAÇÃO</h1>
        <p class="subtitle">Acesso Restrito</p>

        {% if erro %}
            <div class="alert-error">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>
    </div>

</body>
</html>
