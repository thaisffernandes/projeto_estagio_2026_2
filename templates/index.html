<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encomenda de Paletas de Corretivo Personalizadas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg-color: #FFFFFF;
        --header-bg: #000000;
        --card-bg: #FAFAFA;
        --primary-text: #111111;
        --secondary-text: #666666;
        --accent-pink: #E2A3AA;       
        --accent-pink-hover: #D48B93;
        --border-color: #E5E5E5;
        --font-main: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--primary-text);
        font-family: var(--font-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
    }

    .container {
        background-color: var(--card-bg);
        width: 100%;
        max-width: 520px;
        padding: 40px;
        border-radius: 4px; /* Cantos levemente arredondados para visual moderno */
        border: 1px solid var(--border-color);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    .top-badge {
        background-color: #000000;
        color: var(--accent-pink);
        font-size: 0.7rem;
        font-weight: 600;
        text-align: center;
        padding: 6px 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 24px;
        border-radius: 2px;
    }

    .header {
        text-align: left;
        margin-bottom: 30px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 20px;
    }

    .header h1 {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #000000;
        margin-bottom: 6px;
    }

    .header p {
        font-size: 0.85rem;
        color: var(--secondary-text);
        font-weight: 400;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-row {
        display: flex;
        gap: 16px;
    }

    .form-row .form-group {
        flex: 1;
    }

    label {
        display: block;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #111111;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="date"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #D1D1D1;
        border-radius: 2px;
        font-family: var(--font-main);
        font-size: 0.88rem;
        color: var(--primary-text);
        background-color: #FFFFFF;
        transition: all 0.2s ease;
        outline: none;
    }

    input:focus {
        border-color: #000000;
        box-shadow: 0 0 0 1px #000000;
    }

    button {
        width: 100%;
        padding: 15px;
        background-color: #000000;
        color: #FFFFFF;
        border: none;
        border-radius: 2px;
        font-family: var(--font-main);
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
    }

    button:hover {
        background-color: var(--accent-pink);
        color: #000000;
    }

    .alert {
        background-color: #FFF0F2;
        color: #90303D;
        padding: 12px;
        font-size: 0.8rem;
        text-align: center;
        margin-bottom: 20px;
        border: 1px solid var(--accent-pink);
    }
</style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Personalize Sua Paleta</h1>
            <p>Monte a combinação de tons exclusiva para a sua maquiagem</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/pedido" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail de Contato</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="form-group">
                <label for="cores">Cores Desejadas</label>
                <input type="text" id="cores" name="cores" placeholder="Ex: C01, C02, C02" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tamanho">Tamanho (Nº de cores)</label>
                    <input type="number" id="tamanho" name="tamanho" min="1" placeholder="Ex: 12" required>
                </div>

                <div class="form-group">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" name="quantidade" min="1" value="1" required>
                </div>
            </div>

            <div class="form-group">
                <label for="prazo">Prazo Desejado</label>
                <input type="date" id="prazo" name="prazo" required>
            </div>

            <button type="submit">Enviar Solicitação</button>
        </form>
    </div>

</body>
</html>
